# Pins the development toolchain so formatting, linting, and generated output
# are reproducible across contributors and CI. This is the *development*
# toolchain only; the library's supported minimum (MSRV) is `rust-version` in
# Cargo.toml (1.87) and is verified separately in CI.
[toolchain]
channel = "1.91.1"
components = ["rustfmt", "clippy"]
