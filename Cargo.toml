[package]
name = "syren"
version = "0.6.0-rc.1"
edition = "2021"
rust-version = "1.87"
description = "A parallel Rust framework for agent-based models with ECS storage, scheduling, messaging, environments, and optional GPU execution."
license = "MIT"
repository = "https://github.com/AshvinPerera/Syren-ABM-Framework"
homepage = "https://github.com/AshvinPerera/Syren-ABM-Framework"
documentation = "https://docs.rs/syren"
keywords = ["agent-based", "simulation", "ecs", "parallel", "science"]
categories = ["science", "simulation"]
# The published package is an allow-list: only the crate sources, examples,
# tests, benchmarks, changelog, readme, license, and citation ship. Local
# tooling, build output (target), profiling captures (profile), and IDE
# settings are never included.
include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "examples/**/*.yaml",
    "examples/**/*.md",
    "tests/**/*.rs",
    "benches/**/*.rs",
    "CHANGELOG.md",
    "README.md",
    "LICENSE",
    "CITATION.cff",
]

[lib]
name = "syren"
crate-type = ["rlib"]

[package.metadata.docs.rs]
# docs.rs builds the full API surface, including the GPU layer. wgpu compiles
# without a GPU present (only running requires an adapter), so an all-features
# documentation build succeeds in the docs.rs sandbox.
all-features = true

[dependencies]
rayon = "1.7.0"
wgpu = { version = "29.0.1", optional = true }
bytemuck = { version = "1.16", features = ["derive"], optional = true }
pollster = { version = "1.0.1", optional = true }
smallvec = "1.15.1"
thiserror = "2"
parking_lot = { version = "0.12", features = ["arc_lock"] }

[dev-dependencies]
criterion = "0.8.1"
# Integration tests build thread pools of a fixed size to assert that model
# trajectories are reproducible independently of the thread count.
rayon = "1.7.0"

wgpu = "29.0.1"
bytemuck = { version = "1.16", features = ["derive"] }
pollster = "1.0.1"

[features]
default = []
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]
profiling = []
agents = []
environment = []
messaging = []
messaging_gpu = ["messaging", "gpu"]
model = ["agents", "environment"]
gpu_profiling = ["gpu", "profiling"]
all = ["gpu", "agents", "environment", "profiling", "messaging", "messaging_gpu", "model"]

[[bench]]
name = "spawn"
harness = false

[[bench]]
name = "iterate"
harness = false

[[bench]]
name = "tick"
harness = false

[[bench]]
name = "reduce"
harness = false

[[bench]]
name = "query_matching"
harness = false

[[bench]]
name = "scheduler_packing"
harness = false

[[bench]]
name = "environment_dirty_tracking"
harness = false
required-features = ["environment"]

[[bench]]
name = "messaging_finalisation"
harness = false
required-features = ["messaging"]

[[bench]]
name = "structural_mutation"
harness = false

[[bench]]
name = "model_agent"
harness = false
required-features = ["model"]

[[bench]]
name = "scheduler_execution"
harness = false

[[bench]]
name = "parallel_scaling"
harness = false

[[bench]]
name = "message_specialisations"
harness = false
required-features = ["messaging"]

[[bench]]
name = "gpu_startup"
harness = false
required-features = ["gpu"]

[[bench]]
name = "gpu_dispatch"
harness = false
required-features = ["gpu"]

[[bench]]
name = "gpu_tick"
harness = false
required-features = ["gpu"]

[[bench]]
name = "gpu_dispatch_poll"
harness = false
required-features = ["gpu"]

[[bench]]
name = "gpu_readback"
harness = false
required-features = ["gpu"]

[[bench]]
name = "gpu_bind_group_creation"
harness = false
required-features = ["gpu"]

[[bench]]
name = "gpu_message_finalisation"
harness = false
required-features = ["model", "messaging_gpu"]

[[example]]
name = "first_model"
path = "examples/first_model.rs"
required-features = ["model"]

[[example]]
name = "sugarscape"
path = "examples/sugarscape/sugarscape.rs"

[[example]]
name = "macroeconomy"
path = "examples/macroeconomy/main.rs"
required-features = ["model", "messaging"]

# The macroeconomy example is self-contained: sources, tests, config, and docs
# all live under `examples/macroeconomy/`. Cargo looks for integration tests in
# `tests/`, so the path is given explicitly.
[[test]]
name = "macroeconomy"
path = "examples/macroeconomy/tests.rs"
required-features = ["model", "messaging"]
